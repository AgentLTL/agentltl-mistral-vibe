# A pull request for each new Mistral Vibe release (docker/requirements.txt); the e2e workflow
# tests the plugin on it and says so on the pull request when it breaks.
version: 2
updates:
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: daily
    labels: [agent-update]
    commit-message:
      prefix: "Mistral Vibe"
